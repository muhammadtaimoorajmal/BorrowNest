name: BorrowNest CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Test, Audit and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify production dependencies audit
        run: npm audit --omit=dev

      - name: Run ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm run test

      - name: Run production build
        run: npm run build
